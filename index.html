<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Mike's Web Apps</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1>Mike's Web Apps</h1>
        </header>
        <main id="linksGrid" class="grid" aria-live="polite"></main>
    </div>

    <div id="overlay" class="overlay" aria-hidden="true">
        <iframe id="overlayFrame" class="overlay-frame" title="Selected link preview" loading="lazy"></iframe>
        <section id="overlayControls" class="overlay-controls" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
            <div id="overlayDragHandle" class="overlay-drag-handle" title="Drag to move controls">
                <h2 id="overlayTitle" class="overlay-title">Preview</h2>
                <span aria-hidden="true">⋮⋮</span>
            </div>
            <div class="overlay-actions">
                <button id="openInTab" class="overlay-action" type="button">Open in a tab</button>
                <button id="openGithub" class="overlay-action" type="button">Open github</button>
                <button id="closeOverlay" class="overlay-close" type="button" aria-label="Back to overview">Back</button>
            </div>
        </section>
    </div>
    <script type="module" src="app.js"></script>

</body>
</html>
